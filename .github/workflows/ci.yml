name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate static assets and configuration
        run: |
          node -e "const fs = require('fs'); const content = fs.readFileSync('wrangler.jsonc', 'utf8').replace(/\/\/.*$/gm, ''); JSON.parse(content);"
          test -f public/index.html
          test -f public/app.js
          test -f public/styles.css

